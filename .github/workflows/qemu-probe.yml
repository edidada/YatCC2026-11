name: qemu probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: install qemu-user-binfmt
      run: |
        sudo apt-get update
        echo "=== policy ==="
        apt-cache policy qemu-user-binfmt qemu-user-binfmt-hwe || true
        echo "=== install qemu-user-binfmt ==="
        if sudo apt-get install -y qemu-user-binfmt; then echo "APT_OK"; else echo "APT_FAIL"; fi
        echo "=== binaries ==="
        ls -l /usr/bin/qemu-riscv64* 2>/dev/null || echo "NO_BIN_riscv64"
        echo "=== binfmt entry ==="
        ls /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo "NO_BINFMT_MISC"

    - name: run riscv binary under qemu
      run: |
        sudo apt-get install -y gcc-riscv64-linux-gnu
        printf '#include <stdio.h>\nint main(){printf("hello riscv\\n");return 0;}\n' > /tmp/a.c
        riscv64-linux-gnu-gcc -static -o /tmp/a.out /tmp/a.c || echo "CROSS_COMPILE_FAIL"
        ls -l /tmp/a.out
        Q=$(command -v qemu-riscv64-static || command -v qemu-riscv64 || true)
        echo "QEMU found at: [$Q]"
        if [ -n "$Q" ]; then
          echo "=== explicit run ==="
          "$Q" /tmp/a.out || echo "QEMU_RUN_FAIL"
        fi
        echo "=== binfmt transparent run ==="
        /tmp/a.out || echo "BINFMT_RUN_FAIL"
